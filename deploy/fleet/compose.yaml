# The workflow-engine's fragment of the fleet integration stack (obs.5). The coordinator `include`s it; paths are relative to this file.
# Prove it alone: docker compose -p fleet-workflow-engine-check -f deploy/fleet/compose.yaml up -d --build  (then down -v).
# INDEPENDENCE: this app waits only for its own database. The rbac URL is wired by service name; it is called at request time only.
services:
  workflow-engine-db:
    image: postgres:17-alpine
    environment: { POSTGRES_DB: workflow, POSTGRES_USER: workflow, POSTGRES_PASSWORD: workflow }
    volumes: [workflow-engine-pg:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD, pg_isready, -U, workflow, -d, workflow]
      interval: 2s
      timeout: 3s
      retries: 30

  workflow-engine:
    image: fleet/workflow-engine:dev
    build: { context: ../.., dockerfile: Dockerfile }
    environment:
      # Flyway runs the migrations when the app starts.
      DATABASE_URL: jdbc:postgresql://workflow-engine-db:5432/workflow
      DB_USER: workflow
      DB_PASSWORD: workflow
      AUTH_MODE: dev
      NODE_ENV: development
      OTEL_SERVICE_NAME: workflow-engine
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      RBAC_URL: http://rbac:47861
    ports: ['127.0.0.1:${WORKFLOW_ENGINE_PORT:-18831}:47831']
    depends_on: { workflow-engine-db: { condition: service_healthy } }
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://localhost:47831/ready']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 40s

  workflow-engine-web:
    image: fleet/workflow-engine-web:dev
    build: { context: ../../apps/web, dockerfile: Dockerfile }
    ports: ['127.0.0.1:${WORKFLOW_ENGINE_WEB_PORT:-15183}:8080']

volumes:
  workflow-engine-pg:
