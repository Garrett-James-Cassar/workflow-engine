server:
  port: ${PORT:47831}

spring:
  application:
    name: workflow-engine
  jackson:
    deserialization:
      # SECURITY.md: a body with a field the schema does not name is rejected (400).
      fail-on-unknown-properties: true
  datasource:
    # JDBC form, e.g. jdbc:postgresql://127.0.0.1:55434/workflow
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:55434/workflow}
    username: ${DB_USER:workflow}
    password: ${DB_PASSWORD:workflow}

springdoc:
  api-docs:
    path: /openapi.json
  swagger-ui:
    path: /docs

logging:
  level:
    root: ${LOG_LEVEL:INFO}
  # OBSERVABILITY.md section 1: ECS JSON, one object per line on stdout. JSON is the only format.
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: workflow-engine
        version: ${APP_VERSION:dev}
        environment: ${APP_ENV:dev}
    json:
      customizer: dev.workflow.app.config.EventDatasetCustomizer
      exclude:
        - traceId
        - spanId

# OBSERVABILITY.md section 2. OTLP export is off unless OTEL_EXPORTER_OTLP_ENDPOINT is set (OtelEnvironment);
# with it set, Boot maps the standard OTEL_* variables. Metric names follow the OTel HTTP semantic conventions.
management:
  opentelemetry:
    tracing:
      # parentbased_always_on in dev and demo; live sets OTEL_TRACES_SAMPLER=parentbased_traceidratio (+ _ARG), which Boot maps.
      sampler: parent-based-always-on
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.request.duration]": true
        "[http.client.request.duration]": true
  otlp:
    metrics:
      export:
        base-time-unit: seconds

workflow:
  limits:
    # Body cap in bytes (413 over it). The Content-Type must be JSON (415).
    max-body-bytes: ${MAX_BODY_BYTES:1048576}
  rate-limit:
    # SECURITY.md: per user (else client IP) per minute. Disabled only in the test and NFR profiles.
    enabled: ${RATE_LIMIT_ENABLED:true}
    read-per-min: ${RATE_LIMIT_READ_PER_MIN:300}
    write-per-min: ${RATE_LIMIT_WRITE_PER_MIN:60}
    heavy-per-min: ${RATE_LIMIT_HEAVY_PER_MIN:20}
  http:
    # Hosts the built-in http { } service task may call. Empty means none.
    allowed-hosts: ${WORKFLOW_HTTP_ALLOWED_HOSTS:localhost,127.0.0.1}
  service:
    backoff: 200ms
  timeouts:
    poll-interval: ${TIMEOUT_POLL_INTERVAL:5s}
  rbac:
    # The fleet RBAC service (RBAC.md). Unset: LocalRbac evaluates the app's persona file
    # (rbac/workflow-engine.json) so the app starts alone. Required in live mode.
    url: ${RBAC_URL:}
  # Identity (RBAC.md section 3). dev: the X-User header, the only dev header. live: a Supabase Bearer JWT.
  auth:
    mode: ${AUTH_MODE:dev}
    jwt-secret: ${SUPABASE_JWT_SECRET:}
    jwks-url: ${SUPABASE_JWKS_URL:}
