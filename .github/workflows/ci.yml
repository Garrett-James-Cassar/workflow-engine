# Fleet CI (standards/CICD.md). The only provider-specific file: every step is a make target, no logic here.
name: ci
on:
  push: { branches: [main, master] }
  pull_request: {}
  schedule: [{ cron: "0 6 * * 1" }]   # weekly security report
jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ${{ vars.REGISTRY }}
      DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET || 'compose-ssh' }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25 }
      - uses: gradle/actions/setup-gradle@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - run: make web-install
      - run: make ci
        if: github.event_name != 'schedule'
      - run: make console-gate
        if: github.event_name != 'schedule'
      - name: deploy to prod (skipped until DEPLOY_HOST is set)
        run: |
          if [ -z "$DEPLOY_HOST" ]; then echo "DEPLOY_HOST is not set: skipping the prod deploy"; else make release deploy ENV=prod; fi
        if: github.event_name == 'push' && github.ref_name == 'main'
      - run: make security-report
        if: github.event_name == 'schedule'
