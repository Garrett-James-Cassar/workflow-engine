# Fleet CI (standards v1) for Gradle/JVM apps with a web studio: the whole gate is `make ci`
# = ./gradlew check (core + Testcontainers app tests) + the web gate (contract, typecheck,
# style grep, vitest, build, headless mocked Cypress with the 80% coverage gate, Demo chapters).
name: ci
on:
  push: { branches: [main, master] }
  pull_request: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: make web-install
      - name: ci gate
        run: make ci
      - name: screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: test-evidence/web/screenshots
          if-no-files-found: ignore
