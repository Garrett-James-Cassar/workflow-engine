# Git hooks (fleet standard: lefthook). `make hooks` installs them.
#
# pre-commit (t.be.e, ci.a): `make fast` (lint, typecheck, ArchUnit + detekt limits, backend suite on in-memory H2,
#   web unit; no Docker, no browser) and gitleaks on the staged changes; blocks the commit on failure.
# pre-push (t.e2e.c, ci.a): `make push-gate` = fast + the mocked web smoke specs.
#   The full suites run in `make ci` / CI.
pre-commit:
  parallel: true
  jobs:
    - name: fast gate
      run: make fast
    - name: secrets (staged)
      run: gitleaks protect --staged --redact --no-banner
pre-push:
  jobs:
    - name: push gate
      run: make push-gate
